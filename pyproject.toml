[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-atlas-python"
version = "0.1.0"
description = "Python client library for interacting with TimeAtlas API"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["timeatlas", "api", "historical-data", "geospatial"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/epfl-timemachine/time-atlas-python"
Documentation = "https://github.com/epfl-timemachine/time-atlas-python#readme"
Repository = "https://github.com/epfl-timemachine/time-atlas-python"
Issues = "https://github.com/epfl-timemachine/time-atlas-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["timeatlas"]

[tool.setuptools.package-data]
timeatlas = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
